}

<div class="app-layout" [class.collapsed]="sidebarService.collapsed()">
  <app-sidebar />

  <div class="content-wrapper">
    <app-navbar />

    <main class="main-content">
      <router-outlet />
    </main>

    <app-footer />
  </div>
</div>
